<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#449cbd">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Drones">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Checklist Drones</title>
<style>
:root{--a:#449cbd;--n:#0d252b;--v:#52952e;--v2:#52952e;--r:#b00020;--g:#f2f5f6;--t:#0d252b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:16px/1.4 -apple-system,system-ui,Roboto,sans-serif;background:var(--g);color:var(--t);padding-bottom:calc(env(safe-area-inset-bottom) + 20px)}
header{position:sticky;top:0;z-index:5;background:var(--a);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
header h1{font-size:17px;margin:0}
#badge{font-size:13px;background:rgba(255,255,255,.18);padding:5px 10px;border-radius:14px;white-space:nowrap;border:0;color:#fff}
main{padding:12px;max-width:640px;margin:auto}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
h2{font-size:19px;margin:0 0 6px}
h3{font-size:14px;margin:22px 0 4px;color:var(--n);text-transform:uppercase;letter-spacing:.3px;border-bottom:2px solid var(--a);padding-bottom:4px}
.btn{display:block;width:100%;padding:15px;border:0;border-radius:10px;font-size:17px;font-weight:600;background:var(--v);color:#fff;text-align:center;text-decoration:none;margin-top:10px}
.btn:disabled{opacity:.6}
.btn.sec{background:#e3e7e5;color:var(--t)}.btn.rojo{background:var(--r)}
.etapa{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border:2px solid #dfe3e1;border-radius:10px;background:#fff;font-size:16px;font-weight:600;margin-bottom:8px;text-align:left;color:var(--t)}
.etapa.ok{border-color:var(--v2);background:#eef6e9}
.etapa:disabled:not(.ok){opacity:.45}
.etapa .i{font-size:26px}.etapa small{display:block;font-weight:400;color:#666}
.fl{display:block;margin:14px 0 0;font-weight:600}
input[type=number],input[type=text],input[type=password],input[type=time],textarea{display:block;width:100%;margin-top:6px;padding:12px;font-size:17px;border:1.5px solid #c9cfcc;border-radius:8px;background:#fff;font-family:inherit;color:var(--t)}
textarea{min-height:80px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{position:relative;font-weight:600}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-block;padding:11px 16px;border:1.5px solid #c9cfcc;border-radius:22px;background:#fff;min-width:66px;text-align:center}
.chip input:checked+span{background:var(--v2);border-color:var(--v2);color:#fff}
.chip.bad input:checked+span{background:var(--r);border-color:var(--r)}
.r{color:var(--r)}small{font-weight:400;color:#666}
.btnfoto{display:inline-block;margin-top:6px;padding:12px 16px;border:2px dashed var(--v2);border-radius:10px;color:var(--v)}
.mrow{display:flex;gap:8px;align-items:center;margin-top:6px}.mrow input{margin-top:0!important;min-width:0}.mrow .xdel{border:0;background:#eee;border-radius:8px;padding:12px;font-size:16px}
.pv{display:block;max-width:100%;max-height:240px;margin-top:8px;border-radius:8px}
.alerta{background:#fdecea;border-left:4px solid var(--r);padding:10px 12px;border-radius:6px;margin:10px 0}
.info{background:#fff8e1;border-left:4px solid #f0ad00;padding:10px 12px;border-radius:6px;margin-bottom:12px;font-size:14px}
.hist{font-size:13px;color:#555}
#estado{padding:12px;border-radius:8px;background:#fff8e1;margin:10px 0;font-size:16px}#estado.ok{background:#eef6e9;color:#2f6b14;font-size:18px}
</style>
</head>
<body>
<header><div style="display:flex;flex-direction:column;gap:2px"><img src="logo.png" alt="La Hacienda" style="height:20px;width:auto;align-self:flex-start"><h1 style="font-size:13px;font-weight:500;opacity:.9">Checklist operación drones</h1></div><div style="display:flex;gap:6px;align-items:center"><button id="badge">…</button><button id="salirTop" hidden style="font-size:13px;background:rgba(0,0,0,.18);padding:5px 10px;border-radius:14px;border:0;color:#fff">⏻ Salir</button></div></header>
<main id="app"></main>
<script>
/* ================= CONFIGURACIÓN ================= */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbw4iHYEW8FeGOSVenP8edbyvfLag3eH5YdgM9eJSvH3IfNbTy6kov_jlK50Gi7NT88/exec', // URL de la implementación web de Apps Script (termina en /exec)
};
/* ================================================= */

const $ = s => document.querySelector(s);
const app = $('#app');
const pad = n => String(n).padStart(2, '0');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const fmt = d => new Date(d).toLocaleString('es-CO', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const stamp = d => `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}`;
const LS = {
  get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

/* ---------- Definición del checklist ---------- */
const DRONES = ['T100', 'One Piece'];   // nombres de los drones (cada uno con sus equipos marcados)
const NIVEL = ['Lleno', '3/4 tanque', '1/2 tanque', '1/4 tanque', 'Reserva'];
const EQ_DRON = [   // equipos que acompañan a cada dron
  ['bat', 'Baterías del dron', 4], ['ctrl', 'Control remoto', 1], ['bat_ext', 'Baterías externas del control', 2],
  ['carg_bat', 'Cargador de baterías del control', 1], ['carg_ctrl', 'Cargador del control', 1],
  ['relay', 'Antena relay', 1], ['planta', 'Planta EI 14000', 1]
];
const conteo = p => [
  ...DRONES.flatMap((d, i) => [{t:'sec', l:`Conteo de equipos – Dron ${d}`, p:`Dron ${d} · Conteo`},
    ...EQ_DRON.map(([k, l, n]) => ({t:'count', k:`${p}${i}_${k}`, l, exp:n}))]),
  {t:'sec', l:'Conteo – equipo compartido', p:'Compartido · Conteo'},
  {t:'count', k:p + 'rtk', l:'Antena RTK con trípode', exp:1}];
const CK = [
  ['Revisión al tacto', 'Tacto', [['helices', 'Hélices'], ['motores', 'Motores de propulsión'], ['tornillos', 'Tornillos ajustados']]],
  ['Revisión en elevación', 'Elevación', [['al_motores', 'Alertas de motores'], ['valvulas', 'Electroválvulas solenoides'],
    ['al_rtk', 'Alerta conexión antena RTK'], ['al_relay', 'Alerta conexión antena relay']]],
  ['Revisión visual', 'Visual', [['centrif', 'Centrífugas (activar opción de rociado)'], ['caudal', 'Calibración de caudal']]]
];
const checkDron = (d, i) => CK.flatMap(([titulo, corto, items]) => [
  {t:'sec', l:`Dron ${d} – ${titulo}`, p:`Dron ${d} · ${corto}`},
  ...items.map(([k, l]) => ({t:'ok', k:`d${i}_${k}`, l}))]);

const ETAPAS = [
  {id:'mezcla', n:'1. Inicio de preparación de mezcla', ico:'🧪', f:[
    {t:'sec', l:'Control de equipos de mezcla'},
    {t:'ok', k:'motor', l:'Motor'}, {t:'ok', k:'bomba_sum', l:'Bomba sumergible'},
    {t:'ok', k:'bomba_movil', l:'Bomba sumergible móvil'}, {t:'ok', k:'taladro', l:'Taladro'},
    {t:'photo', k:'foto', l:'Foto de los equipos de mezcla (opcional)', opt:1},
    {t:'text', k:'obs', l:'Novedades / observaciones', opt:1}]},
  {id:'inventario', n:'2. Inventario después de la última mezcla', ico:'📦', req:'mezcla', f:[
    {t:'sec', l:'Cantidades que quedan', p:'Inventario'},
    {t:'num', k:'dithane', l:'Dithane', u:'L'}, {t:'num', k:'aceite', l:'Aceite', u:'L'},
    {t:'num', k:'acond', l:'Acondicionador', u:'kg'}, {t:'num', k:'hypotensor', l:'Hypotensor', u:'L'},
    {t:'num', k:'photon', l:'Photon', u:'L'}, {t:'num', k:'atp', l:'ATP', u:'L'},
    {t:'multi', k:'sist', l:'Sistémicos (cuál y cantidad en litros)'},
    {t:'photo', k:'foto', l:'Foto del inventario (opcional)', opt:1},
    {t:'text', k:'obs', l:'Observaciones', opt:1}]},
  {id:'prevuelo', n:'3. Antes del vuelo + solicitar autorización', ico:'🌤️', req:'inventario', f:[
    {t:'sec', l:'Condiciones del clima', p:'Clima'},
    {t:'num', k:'temp', l:'Temperatura', u:'°C'}, {t:'photo', k:'foto_temp', l:'Foto de la temperatura', cam:1},
    {t:'num', k:'humedad', l:'Humedad', u:'%'}, {t:'photo', k:'foto_hum', l:'Foto de la humedad', cam:1},
    {t:'num', k:'viento', l:'Velocidad del viento', u:'km/h'}, {t:'photo', k:'foto_viento', l:'Foto de la velocidad del viento', cam:1},
    {t:'num', k:'presion', l:'Presión barométrica', u:'hPa'}, {t:'photo', k:'foto_presion', l:'Foto de la presión barométrica', cam:1},
    ...DRONES.flatMap((d, i) => [...checkDron(d, i),
      {t:'sec', l:`Dron ${d} – Equipos`, p:`Dron ${d}`},
      {t:'num', k:`bat_relay${i}`, l:'Batería antena relay', u:'%'},
      {t:'sel', k:`gas_p${i}`, l:'Gasolina planta EI 14000', o:NIVEL}]),
    {t:'sec', l:'Antena RTK (compartida)', p:'RTK'},
    {t:'num', k:'bat_rtk', l:'Batería antena RTK', u:'%'},
    ...conteo('ini_'),
    {t:'photo', k:'foto_equipos', l:'Foto de los drones y equipos (opcional)', opt:1},
    {t:'text', k:'obs', l:'Novedades / observaciones', opt:1}]},
  {id:'autorizacion', n:'4. Autorización y parámetros de vuelo', ico:'🟢', req:'prevuelo', f:[
    {t:'text', k:'por', l:'Autorizado por'},
    {t:'sel', k:'medio', l:'Medio', o:['Llamada', 'Mensaje', 'SMS', 'En persona']},
    {t:'time', k:'hora', l:'Hora de la autorización'},
    {t:'sec', l:'Indicaciones recibidas – parámetros de vuelo', p:'Parámetros'},
    {t:'num', k:'gota', l:'Tamaño de gota', u:'µm'}, {t:'num', k:'vel', l:'Velocidad de vuelo', u:'m/s'},
    {t:'num', k:'ancho', l:'Ancho de pasada', u:'m'}, {t:'num', k:'vol', l:'Volumen de aplicación', u:'L/ha'},
    {t:'text', k:'obs', l:'Otras indicaciones', opt:1}]},
  {id:'cierre', n:'5. Finalización de la operación', ico:'🏁', req:'autorizacion', f:[
    {t:'sec', l:'Horario de vuelo', p:'Vuelo'},
    {t:'time', k:'hora_ini', l:'Hora de inicio'}, {t:'time', k:'hora_fin', l:'Hora de finalización'},
    ...DRONES.flatMap((d, i) => [
      {t:'sec', l:`Dron ${d}`, p:`Dron ${d}`},
      {t:'num', k:`area_${i}`, l:'Área aplicada', u:'ha'},
      {t:'num', k:`horas_p${i}`, l:'Horas planta EI 14000', u:'h'},
      {t:'sel', k:`gas_p${i}`, l:'Gasolina planta EI 14000', o:NIVEL},
      ...[1, 2, 3, 4].map(b => ({t:'num', k:`ciclos_${i}_${b}`, l:`Ciclos batería ${b}`}))]),
    {t:'sec', l:'Furgón', p:'Furgón'},
    {t:'sel', k:'gas_furgon', l:'Gasolina del furgón', o:NIVEL},
    {t:'sec', l:'Mapa de aplicación', p:'Mapa'},
    {t:'photo', k:'foto_mapa', l:'Foto del mapa en la APP (opcional)', opt:1},
    {t:'yn', k:'mapa_ok', l:'¿Conectaron los equipos a internet y verificaron en el mapa cómo quedó la aplicación?'},
    ...conteo('fin_'),
    {t:'text', k:'obs', l:'Novedades / observaciones', opt:1}]}
];
const NOVEDAD = {id:'novedad', n:'Novedad durante la operación', ico:'⚠️', f:[
  {t:'sel', k:'tipo', l:'Tipo de novedad', o:['Clima', ...DRONES.map(d => 'Dron ' + d), 'Planta', 'Antenas', 'Equipo de mezcla', 'Otro']},
  {t:'text', k:'desc', l:'Descripción de la novedad'},
  {t:'sel', k:'accion', l:'Acción tomada', o:['Operación suspendida – esperando indicaciones', 'Se reanudó con autorización']},
  {t:'photo', k:'foto', l:'Foto de la novedad (opcional)', opt:1}]};
const ALL = [...ETAPAS, NOVEDAD];
ALL.forEach(e => { let p = ''; e.f.forEach(f => {
  if (f.t === 'sec') { p = f.p || ''; return; }
  f.L = (p ? p + ' – ' : '') + f.l + (f.u ? ` (${f.u})` : '');
}); });

/* ---------- Almacenamiento local (IndexedDB) ---------- */
const DB = {
  _db: null,
  open() { return this._db || (this._db = new Promise((res, rej) => {
    const r = indexedDB.open('checklist_drones', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('cola', {keyPath:'id'});
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  })); },
  async run(mode, fn) { const db = await this.open(); return new Promise((res, rej) => {
    const t = db.transaction('cola', mode), q = fn(t.objectStore('cola'));
    t.oncomplete = () => res(q.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  }); },
  put: r => DB.run('readwrite', s => s.put(r)),
  all: () => DB.run('readonly', s => s.getAll()),
  count: () => DB.run('readonly', s => s.count()),
  get: id => DB.run('readonly', s => s.get(id)),
  del: id => DB.run('readwrite', s => s.delete(id))
};

/* ---------- Fotos y GPS ---------- */
let FOT = {}, GPS = '';
function pedirGPS() {
  navigator.geolocation?.getCurrentPosition(
    p => GPS = `${p.coords.latitude.toFixed(6)},${p.coords.longitude.toFixed(6)} ±${Math.round(p.coords.accuracy)}m`,
    () => {}, {enableHighAccuracy:true, timeout:30000, maximumAge:120000});
}
function comprimir(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const M = 1280, s = Math.min(1, M / Math.max(img.width, img.height));
      const w = Math.round(img.width * s), h = Math.round(img.height * s);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const x = c.getContext('2d'); x.drawImage(img, 0, 0, w, h);
      x.fillStyle = 'rgba(0,0,0,.55)'; x.fillRect(0, h - 34, w, 34);
      x.fillStyle = '#fff'; x.font = 'bold 18px sans-serif';
      x.fillText('🕒 ' + fmt(new Date()) + (GPS ? '  📍 ' + GPS.split(' ')[0] : ''), 10, h - 11);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.6));
    };
    img.onerror = rej; img.src = url;
  });
}

/* ---------- Pantallas ---------- */
function avisos() {
  let h = '';
  if (!/^https:\/\/script\.google\.com\//.test(CONFIG.API_URL))
    h += `<div class="alerta">⚙️ Falta configurar la URL del servidor (CONFIG.API_URL). Los registros se guardan pero no se envían.</div>`;
  const inst = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if (!inst) {
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
    h += `<div class="info"><b>📲 Instale la app:</b> ${ios
      ? 'en Safari toque <b>Compartir ⬆️</b> → <b>Agregar a pantalla de inicio</b>. Use siempre el ícono, no Safari.'
      : 'en Chrome toque <b>⋮</b> → <b>Instalar app</b> o <b>Agregar a pantalla principal</b>.'}</div>`;
  }
  return h;
}
function hist(txt, d) { LS.set('hist', [{txt, d:d.toISOString()}, ...LS.get('hist', [])].slice(0, 15)); }
function histHTML() {
  const h = LS.get('hist', []);
  return h.length ? `<div class="card"><h2>Últimos registros</h2><div class="hist">${h.map(x => `• ${esc(x.txt)} — ${fmt(x.d)}`).join('<br>')}</div></div>` : '';
}

function login() {
  app.innerHTML = avisos() + `<div class="card"><h2>🔐 Ingreso</h2><p class="hist">El primer ingreso necesita internet. Después funciona sin señal.</p><form id="flog">
    <label class="fl">Usuario<input type="text" name="u" autocapitalize="none" autocomplete="username" required></label>
    <label class="fl">Contraseña<input type="password" name="c" autocomplete="current-password" required></label>
    <div id="err"></div><button class="btn" id="blog">Ingresar</button></form></div>`;
  $('#flog').onsubmit = async ev => {
    ev.preventDefault();
    const fd = new FormData(ev.target), u = fd.get('u').trim(), c = fd.get('c'), b = $('#blog');
    b.disabled = true; b.textContent = 'Verificando…';
    try {
      const res = await fetch(CONFIG.API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify({tipo:'login', usuario:u, clave:c})});
      const j = await res.json();
      if (!j.ok) throw new Error(j.error === 'auth' ? 'Usuario o contraseña incorrectos' : j.error);
      LS.set('user', {u, c, nombre:j.nombre || u}); home(); sync();
    } catch (err) {
      const m = !navigator.onLine ? 'Sin internet. El primer ingreso necesita señal.'
        : /fetch|network|load/i.test(err.message) ? 'No se pudo conectar con el servidor. Revise la señal o avise al administrador.' : err.message;
      $('#err').innerHTML = `<div class="alerta">${esc(m)}</div>`;
      b.disabled = false; b.textContent = 'Ingresar';
    }
  };
  badge();
}

async function salir() {
  const n = await DB.count().catch(() => 0), op = LS.get('op', null);
  let msg = '¿Cerrar sesión?';
  if (op) msg = 'Hay una operación en curso (' + op.finca + '). Queda guardada en este teléfono y puede continuarla al ingresar de nuevo.\n\n' + msg;
  if (n) msg = 'Hay ' + n + ' registro(s) sin enviar. Se enviarán cuando vuelva a ingresar con internet.\n\n' + msg;
  if (!confirm(msg)) return;
  LS.set('user', null); home();
}

function home() {
  scrollTo(0, 0);
  const user = LS.get('user', null);
  $('#salirTop').hidden = !user; $('#salirTop').onclick = salir;
  if (!user) return login();
  const op = LS.get('op', null);
  let h = avisos();
  if (!op) {
    const fincas = LS.get('fincas', []);
    h += `<div class="card"><h2>Nueva operación</h2><p class="hist">👤 ${esc(user.nombre)}</p><form id="fop">
      <label class="fl">Finca / Lote <b class="r">*</b><input type="text" name="finca" list="dlf" required></label>
      <datalist id="dlf">${fincas.map(f => `<option value="${esc(f)}">`).join('')}</datalist>
      <button class="btn">▶️ Iniciar operación</button></form></div>` + histHTML();
    app.innerHTML = h;
    $('#fop').onsubmit = ev => {
      ev.preventDefault();
      const f = new FormData(ev.target).get('finca').trim(), r = user.nombre;
      if (!f) return;
      LS.set('fincas', [f, ...fincas.filter(x => x !== f)].slice(0, 15));
      const d = new Date();
      LS.set('op', {id:'OP-' + stamp(d), finca:f, resp:r, ini:d.toISOString(), done:{}, nov:0});
      home();
    };
  } else {
    h += `<div class="card"><h2>📍 ${esc(op.finca)}</h2><div class="hist">👤 ${esc(op.resp)} · ${esc(op.id)}<br>Iniciada: ${fmt(op.ini)}</div></div>`;
    h += ETAPAS.map(e => {
      const d = op.done[e.id], bloq = e.req && !op.done[e.req];
      return `<button class="etapa ${d ? 'ok' : ''}" ${d || bloq ? 'disabled' : ''} data-e="${e.id}"><span class="i">${d ? '✅' : e.ico}</span>
        <span>${e.n}<small>${d ? 'Registrado ' + fmt(d) : bloq ? 'Primero complete la etapa anterior' : 'Pendiente'}</small></span></button>`;
    }).join('');
    h += `<button class="btn rojo" data-e="novedad">⚠️ Reportar novedad${op.nov ? ` (${op.nov} reportadas)` : ''}</button>
      <button class="btn sec" id="anular" style="margin-top:28px;font-size:14px;padding:10px">Anular esta operación</button>`;
    app.innerHTML = h;
    app.querySelectorAll('[data-e]').forEach(b => b.onclick = () => abrir(b.dataset.e));
    $('#anular').onclick = () => {
      if (confirm('¿Anular la operación? Lo que ya se guardó se conserva y se envía.')) { LS.set('op', null); home(); }
    };
  }
  badge();
}

function chips(f, opts, req) {
  return `<div class="fl">${esc(f.l)}${req}<div class="chips">${opts.map(o =>
    `<label class="chip ${o === 'Falla' || o === 'No' ? 'bad' : ''}"><input type="radio" name="${f.k}" value="${esc(o)}"><span>${esc(o)}</span></label>`).join('')}</div></div>`;
}
function campo(f) {
  const req = f.opt ? '' : ' <b class="r">*</b>';
  const now = new Date(), hhmm = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  switch (f.t) {
    case 'sec': return `<h3>${esc(f.l)}</h3>`;
    case 'ok': return chips(f, ['OK', 'Falla'], req);
    case 'yn': return chips(f, ['Sí', 'No'], req);
    case 'sel': return chips(f, f.o, req);
    case 'num': return `<label class="fl">${esc(f.l)}${f.u ? ` <small>(${f.u})</small>` : ''}${req}<input type="number" inputmode="decimal" step="any" name="${f.k}"></label>`;
    case 'count': return `<label class="fl">${esc(f.l)} <small>(deben ser ${f.exp})</small>${req}<input type="number" inputmode="numeric" step="1" min="0" name="${f.k}"></label>`;
    case 'time': return `<label class="fl">${esc(f.l)}${req}<input type="time" name="${f.k}" value="${hhmm}"></label>`;
    case 'photo': return `<div class="fl">${esc(f.l)}${req}<br><label class="btnfoto">📷 Tomar foto<input type="file" accept="image/*" ${f.cam ? 'capture="environment"' : ''} data-k="${f.k}" hidden></label><img id="pv_${f.k}" class="pv" hidden alt=""></div>`;
    case 'multi': return `<div class="fl">${esc(f.l)}${req}<div id="m_${f.k}"></div><button type="button" class="btn sec" style="padding:10px;font-size:15px;margin-top:8px" data-add="${f.k}">➕ Agregar otro</button></div>`;
    case 'text': return /^(obs|desc)/.test(f.k)
      ? `<label class="fl">${esc(f.l)}${req}<textarea name="${f.k}"></textarea></label>`
      : `<label class="fl">${esc(f.l)}${req}<input type="text" name="${f.k}"></label>`;
  }
  return '';
}

function abrir(id) {
  const e = ALL.find(x => x.id === id), op = LS.get('op', null);
  if (!op || !e) return home();
  FOT = {}; GPS = ''; pedirGPS();
  app.innerHTML = `<div class="card"><button class="btn sec" id="volver" style="margin:0 0 10px;padding:10px">← Volver</button>
    <h2>${e.ico} ${esc(e.n)}</h2><div class="hist">📍 ${esc(op.finca)} · 👤 ${esc(op.resp)}</div>
    <form id="frm" novalidate>${e.f.map(campo).join('')}<div id="err"></div><button class="btn" id="bguardar">💾 Guardar registro</button></form></div>`;
  scrollTo(0, 0);
  $('#volver').onclick = () => { if (confirm('¿Salir sin guardar?')) home(); };
  app.querySelectorAll('input[type=file]').forEach(inp => inp.onchange = async () => {
    const file = inp.files[0]; if (!file) return;
    const pv = $('#pv_' + inp.dataset.k);
    try { FOT[inp.dataset.k] = await comprimir(file); pv.src = FOT[inp.dataset.k]; pv.hidden = false; }
    catch { alert('No se pudo procesar la foto. Intente de nuevo.'); }
  });
  app.querySelectorAll('[data-add]').forEach(b => { const k = b.dataset.add; filaMulti(k); b.onclick = () => filaMulti(k); });
  $('#frm').onsubmit = ev => { ev.preventDefault(); guardar(e, op, ev.target); };
}
function filaMulti(k) {
  const c = $('#m_' + k), div = document.createElement('div');
  div.className = 'mrow';
  div.innerHTML = `<input type="text" placeholder="Cuál" data-c="n" style="flex:2"><input type="number" inputmode="decimal" step="any" placeholder="Litros" data-c="l" style="flex:1"><button type="button" class="xdel">✕</button>`;
  div.querySelector('.xdel').onclick = () => { if (c.children.length > 1) div.remove(); else div.querySelectorAll('input').forEach(i => i.value = ''); };
  c.appendChild(div);
}

function leer(e, frm) {
  const campos = [], vals = {}, alertas = [], faltan = [];
  for (const f of e.f) {
    if (f.t === 'sec') continue;
    let v;
    if (f.t === 'multi') {
      const filas = [...frm.querySelectorAll(`#m_${f.k} .mrow`)].map(r => [r.querySelector('[data-c=n]').value.trim(), r.querySelector('[data-c=l]').value.trim()]).filter(x => x[0] || x[1]);
      if (!filas.length && !f.opt) { faltan.push(f.l + ' (agregue al menos uno)'); continue; }
      if (filas.some(x => !x[0] || !x[1])) { faltan.push(f.l + ': complete cuál y cantidad'); continue; }
      filas.forEach((x, i) => { campos.push({l:`Inventario – Sistémico ${i + 1} (cuál)`, v:x[0]}); campos.push({l:`Inventario – Sistémico ${i + 1} (L)`, v:x[1]}); });
      vals[f.k] = filas.map(x => `${x[0]}: ${x[1]} L`).join('; ');
      continue;
    }
    if (['ok', 'yn', 'sel'].includes(f.t)) v = frm.querySelector(`input[name="${f.k}"]:checked`)?.value || '';
    else if (f.t === 'photo') v = FOT[f.k] ? '📷' : '';
    else v = (frm.elements[f.k]?.value || '').trim();
    vals[f.k] = v;
    if (!v && !f.opt) { faltan.push(f.L); continue; }
    if (v === 'Falla') alertas.push(`${f.L}: FALLA`);
    if (f.t === 'count' && v !== '' && +v !== f.exp) alertas.push(`${f.L}: hay ${v} de ${f.exp}`);
    if (f.k === 'mapa_ok' && v === 'No') alertas.push('Mapa de aplicación NO verificado');
    if (f.k === 'accion' && v.startsWith('Operación suspendida')) alertas.push('OPERACIÓN SUSPENDIDA – esperando indicaciones');
    if (f.t !== 'photo') campos.push({l:f.L, v});
  }
  const obs = e.f.find(f => f.k === 'obs');
  if (obs && alertas.length && !vals.obs) faltan.push('Observaciones (obligatorio cuando hay fallas o faltantes)');
  return {campos, vals, alertas, faltan};
}

async function guardar(e, op, frm) {
  const {campos, vals, alertas, faltan} = leer(e, frm);
  if (faltan.length) {
    $('#err').innerHTML = `<div class="alerta"><b>Faltan datos obligatorios:</b><br>${faltan.map(esc).join('<br>')}</div>`;
    $('#err').scrollIntoView({behavior:'smooth', block:'center'});
    return;
  }
  const btn = $('#bguardar'); btn.disabled = true; btn.textContent = 'Guardando…';
  if (e.id === 'cierre') {
    const t = Math.round(DRONES.reduce((s, d, i) => s + (+vals['area_' + i] || 0), 0) * 100) / 100;
    vals.area_total = String(t); campos.push({l:'Área total (ha)', v:String(t)});
  }
  const d = new Date(), fotos = {};
  e.f.filter(f => f.t === 'photo' && FOT[f.k]).forEach(f => fotos[f.l] = FOT[f.k]);
  const r = {id:uid(), op:op.id, finca:op.finca, resp:op.resp, etapa:e.id, etapaNombre:e.n,
    fecha:d.toISOString(), fechaLocal:fmt(d), gps:GPS, campos, alertas, fotos, vals};
  try { await DB.put(r); }
  catch (err) {
    alert('No se pudo guardar en el teléfono (' + err.message + '). Libere espacio e intente de nuevo.');
    btn.disabled = false; btn.textContent = '💾 Guardar registro'; return;
  }
  if (e.id === 'novedad') op.nov = (op.nov || 0) + 1; else op.done[e.id] = d.toISOString();
  hist(`${e.n} · ${op.finca}`, d);
  LS.set('op', e.id === 'cierre' ? null : op);
  guardado(r, e);
  sync();
  vigilar(r.id);
}
function vigilar(id) {   // muestra "enviado con éxito" cuando el registro sale del teléfono
  const t = setInterval(async () => {
    const el = $('#estado'); if (!el || el.dataset.id !== id) return clearInterval(t);
    let pend = true; try { pend = !!(await DB.get(id)); } catch {}
    if (!pend) { el.className = 'ok'; el.innerHTML = '✅ <b>Formulario enviado con éxito</b>'; clearInterval(t); }
    else el.innerHTML = navigator.onLine ? '⏳ Enviando…' : '📴 Sin señal: quedó guardado en el teléfono y se enviará automáticamente cuando haya internet.';
  }, 1500);
}

function guardado(r, e) {
  const pedir = e.id === 'prevuelo';
  app.innerHTML = `<div class="card"><h2>💾 Formulario guardado</h2><p class="hist">${esc(e.n)}<br>${r.fechaLocal}</p>
    <div id="estado" data-id="${r.id}">⏳ Enviando…</div>
    ${r.alertas.length ? `<div class="alerta">⚠️ ${r.alertas.map(esc).join('<br>')}</div>` : ''}
    ${pedir ? '<div class="info" style="margin-top:12px">📞 <b>Solicite la autorización</b> por llamada o mensaje.<br>⛔ <b>No inicie el vuelo</b> hasta recibirla. Cuando la reciba, registre la etapa 4.</div>' : ''}
    ${e.id === 'novedad' && r.vals.accion?.startsWith('Operación suspendida') ? '<div class="info" style="margin-top:12px">🛑 Operación suspendida. Espere indicaciones antes de continuar.</div>' : ''}
    <button class="btn sec" id="ok">Volver al inicio</button></div>`;
  $('#ok').onclick = home; scrollTo(0, 0);
}

/* ---------- Sincronización ---------- */
let syncing = false;
async function badge() {
  let n = 0; try { n = await DB.count(); } catch {}
  const b = $('#badge');
  b.textContent = syncing ? '⏳ Enviando…' : n ? `📴 ${n} por enviar` : '✅ Al día';
  b.onclick = () => sync(true);
}
async function sync(manual) {
  if (syncing) return;
  if (!/^https:\/\/script\.google\.com\//.test(CONFIG.API_URL)) return badge();
  if (!navigator.onLine) { if (manual === true) alert('Sin señal. Se enviará cuando haya internet.'); return badge(); }
  syncing = true; badge();
  let error = '';
  try {
    const pend = (await DB.all()).sort((a, b) => a.fecha < b.fecha ? -1 : 1);
    for (const r of pend) {
      const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 90000);
      const user = LS.get('user', null);
      if (!user) break;
      const {vals, fechaLocal, ...envio} = r;
      envio.usuario = user.u; envio.clave = user.c;
      const res = await fetch(CONFIG.API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify(envio), signal:ctl.signal});
      clearTimeout(to);
      const j = await res.json();
      if (j.error === 'auth') {
        LS.set('user', null);
        alert('Su usuario o contraseña cambió. Ingrese de nuevo; los registros pendientes se conservan.');
        break;
      }
      if (!j.ok) throw new Error(j.error || 'respuesta inválida');
      await DB.del(r.id);
    }
  } catch (err) { error = err.message; console.warn('sync', err); }
  syncing = false; await badge();
  if (manual === true) alert(error ? 'No se pudo enviar todo: ' + error : 'Todo enviado ✅');
}

/* ---------- Inicio ---------- */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
navigator.storage?.persist?.();
addEventListener('online', () => sync());
document.addEventListener('visibilitychange', () => { if (!document.hidden) sync(); });
setInterval(() => sync(), 60000);
home(); sync();
</script>
